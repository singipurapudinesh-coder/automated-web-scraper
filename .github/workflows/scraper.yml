name: Automated Web Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize scraper database
        run: python cli.py init
        env:
          SELENIUM_HEADLESS: "true"

      - name: Run quotes scraper
        run: python cli.py run quotes_sample
        env:
          SELENIUM_HEADLESS: "true"

      - name: Run books scraper
        run: python cli.py run books_sample
        env:
          SELENIUM_HEADLESS: "true"

      - name: Export scraped data
        run: |
          python cli.py export --job quotes_sample --format csv
          python cli.py export --job quotes_sample --format json
          python cli.py export --job books_sample --format csv
          python cli.py export --job books_sample --format json

      - name: Save scraped data as downloadable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-exports
          path: exports/
          if-no-files-found: ignore
          retention-days: 14
