version: '3.8'

services:
  # Message Broker for Distributed Celery
  redis:
    image: redis:7-alpine
    container_name: scraper_redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Distributed Celery Worker (Executes Scraping Tasks)
  celery_worker:
    build: .
    container_name: scraper_celery_worker
    command: celery -A celery_app.app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SELENIUM_HEADLESS=true
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Distributed Celery Beat (Dispatches Periodic Cron Schedules)
  celery_beat:
    build: .
    container_name: scraper_celery_beat
    command: celery -A celery_app.app beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Optional Standalone Mode (Zero-Redis dependency - run with: docker compose --profile standalone up)
  standalone_scheduler:
    build: .
    container_name: scraper_standalone_scheduler
    command: python cli.py schedule --run-now
    profiles:
      - standalone
    environment:
      - SELENIUM_HEADLESS=true
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    restart: unless-stopped
